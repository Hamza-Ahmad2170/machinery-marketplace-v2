  "@types/node": ^24.0.0
  dotenv-cli: ^11.0.0
  turbo: ^2.11.10
  tsx: ^4.23.15
  typescript: ~6.0.3
  zod: ^4.6.7
  # data + auth
  better-auth: ^1.7.14
  auth: ^1.7.14
  "@better-auth/drizzle-adapter": ^1.7.14
  drizzle-orm: 1.0.0-rc.5
  drizzle-kit: 1.0.0-rc.5
  pg: ^8.23.1
  "@types/pg": ^8.15.0
  "@t3-oss/env-core": ^0.13.11
  "@t3-oss/env-nextjs": ^0.13.11
  # api
  hono: ^4.13.14
  "@hono/node-server": ^2.1.5
  "@hono/zod-validator": ^0.9.1
  tsdown: ^0.23.3
  # react (keep aligned with Expo's pinned React when mobile is added)
  react: 19.3.1
  react-dom: 19.3.1
  "@types/react": ^19.2.0
  "@types/react-dom": ^19.2.0
